<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>猴爪許願機 | The Monkey's Paw</title>
  <meta name="description" content="向古老的猴爪許願，獲得字面上的完美實現以及出乎意料的可怕詛咒。">
  <meta name="theme-color" content="#0f0f12">

  <!-- Emoji Favicon & PWA App 設定 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪬</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="猴爪許願機">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2318181f'/><text y='.9em' font-size='80' x='10'>🪬</text></svg>">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- 頂部標題與齒輪按鈕 -->
    <div class="header-bar">
      <h1>🪬 猴爪許願機</h1>
      <button class="icon-btn" onclick="toggleModal(true)" title="設定與說明">⚙️</button>
    </div>

    <!-- 許願次數統計 -->
    <div class="paw-status">
      已簽訂契約次數：<span id="wishCounter">0</span> 次
    </div>

    <div class="wish-box">
      <textarea id="wishInput" placeholder="寫下你的願望...（例如：我希望能獲得1億元）"></textarea>
      <button id="wishBtn" onclick="makeWish()">向猴爪許願</button>
    </div>

    <div class="loading" id="loading">猴爪正在扭曲現實...</div>

    <!-- 許願結果卡片 -->
    <div class="result-card" id="resultCard">
      <div class="result-section">
        <h3>【願望實現】</h3>
        <p id="grantedText"></p>
      </div>
      <div class="result-section">
        <h3>【恐怖副作用】</h3>
        <p id="sideEffectText"></p>
      </div>
      <div class="result-section">
        <h3>【精靈的嘲諷】</h3>
        <p id="tauntText" class="taunt"></p>
      </div>

      <!-- 單次許願結果分享按鈕 -->
      <button class="share-btn" onclick="shareWishResult()">🔗 將這個詛咒分享給好友</button>
    </div>
  </div>

  <!-- ⚙️ 設定與說明 Modal 彈窗 -->
  <div id="settingsModal" class="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚙️ 關於與設定</h2>
        <button class="close-btn" onclick="toggleModal(false)">&times;</button>
      </div>
      
      <div class="modal-body">
        <div class="modal-section">
          <h3>📜 遊戲規則</h3>
          <p>源自 W. W. Jacobs 的經典恐怖故事。猴爪精靈會嚴格根據你的「字面描述」實現願望，但每一個願望都伴隨著不可預知的黑暗代價。</p>
        </div>

        <!-- 🔗 齒輪內的全新分享專區 -->
        <div class="modal-section">
          <h3>🔗 邀請朋友許願</h3>
          <p>獨樂樂不如眾樂樂，讓朋友也來體驗許願的下場：</p>
          <div class="modal-share-btns">
            <button class="modal-btn" onclick="copySiteUrl()">📋 複製網址</button>
            <button class="modal-btn primary" onclick="shareSiteNative()">📲 系統分享</button>
          </div>
        </div>

        <div class="modal-section">
          <h3>📱 如何安裝為手機 App？</h3>
          <p><strong>iOS (Safari)：</strong> 點擊瀏覽器底部的「分享」按鈕 ➔ 選擇「新增至主畫面」。</p>
          <p><strong>Android (Chrome)：</strong> 點擊右上角選單「⋮」 ➔ 選擇「安裝應用程式」或「加到主畫面」。</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let totalWishes = 0;
    let lastWishResult = null;

    async function makeWish() {
      const input = document.getElementById('wishInput');
      const wish = input.value.trim();

      if (!wish) {
        alert('請先寫下你的願望！');
        return;
      }

      const btn = document.getElementById('wishBtn');
      const loading = document.getElementById('loading');
      const resultCard = document.getElementById('resultCard');

      btn.disabled = true;
      loading.style.display = 'block';
      resultCard.style.display = 'none';

      try {
        const response = await fetch('/api/wish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wish })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.error || '願望被現實拒絕了');

        lastWishResult = { wish, ...data };

        document.getElementById('grantedText').innerText = data.granted;
        document.getElementById('sideEffectText').innerText = data.side_effect;
        document.getElementById('tauntText').innerText = data.taunt;

        resultCard.style.display = 'block';

        totalWishes++;
        document.getElementById('wishCounter').innerText = totalWishes;

      } catch (err) {
        alert('許願失敗：' + err.message);
      } finally {
        btn.disabled = false;
        loading.style.display = 'none';
      }
    }

    // 1. ⚙️ 設定區功能：純複製網站網址
    function copySiteUrl() {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        alert('網站網址已成功複製到剪貼簿！');
      }).catch(() => {
        alert('複製失敗，請手動複製網址：' + url);
      });
    }

    // 2. ⚙️ 設定區功能：呼叫原生分享（含網站介紹詞）
    async function shareSiteNative() {
      const shareData = {
        title: '猴爪許願機 | The Monkey\'s Paw',
        text: '來向古老邪惡的猴爪許願吧！小心你的願望成真... 🪬',
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {
          if (err.name !== 'AbortError') console.log('分享失敗:', err);
        }
      } else {
        // 若電腦或瀏覽器不支援原生分享，自動降級為複製網址
        copySiteUrl();
      }
    }

    // 3. 🎯 結果區功能：分享單次許願內容與代價
    async function shareWishResult() {
      const shareUrl = window.location.href;
      let shareText = "來向古老邪惡的猴爪許願吧！小心你的願望成真... 🪬";

      if (lastWishResult) {
        shareText = `【🪬 猴爪許願機】\n` +
                    `我許願：「${lastWishResult.wish}」\n\n` +
                    `✨ 願望實現：${lastWishResult.granted}\n` +
                    `💀 恐怖副作用：${lastWishResult.side_effect}\n` +
                    `😈 精靈嘲諷：${lastWishResult.taunt}\n\n` +
                    `快來看看你的願望會帶來什麼代價：`;
      }

      if (navigator.share) {
        try {
          await navigator.share({
            title: '猴爪許願機 | The Monkey\'s Paw',
            text: shareText,
            url: shareUrl
          });
        } catch (err) {
          if (err.name !== 'AbortError') console.log('分享失敗:', err);
        }
      } else {
        const fullContent = `${shareText}\n${shareUrl}`;
        navigator.clipboard.writeText(fullContent).then(() => {
          alert('許願結果與連結已複製到剪貼簿！');
        }).catch(() => {
          alert('複製失敗，請手動複製！');
        });
      }
    }

    // Modal 控制邏輯
    function toggleModal(show) {
      const modal = document.getElementById('settingsModal');
      modal.classList.toggle('active', show);
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'settingsModal') toggleModal(false);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Error:', err));
      });
    }
  </script>
</body>
</html>
